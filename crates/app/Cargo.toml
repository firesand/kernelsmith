[package]
name = "kernelsmith"
description = "Guided, hardware-aware custom kernel builder for Gentoo Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kernelsmith"
path = "src/main.rs"

[dependencies]
kernelsmith-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
